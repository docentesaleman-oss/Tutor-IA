<!doctype html>
<html lang="en" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <title>Written guided practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="close-practice" class="close-practice" type="button" aria-label="Close practice">×</button>
    <main class="stage" aria-label="Written guided practice">
        <section class="tutor-message" aria-live="polite">
            <div>
                <p id="tutor-text">Loading your practice…</p>
                <p class="question">Write your response below.</p>
            </div>
        </section>
        <section class="suggestion-card" aria-label="Suggested phrases">
            <p class="hint">💡 You can write…</p>
            <div id="suggestions" class="suggestions"></div>
        </section>
        <section class="natural-note"><span>▣</span><p>Keep the conversation natural.<br>You can ask questions, request clarification, or share your opinion.</p></section>
        <button id="help" class="corner-action help" type="button"><span>?</span>Help</button>
        <form id="composer" class="composer">
            <textarea id="message" rows="2" placeholder="Write your answer…" aria-label="Your answer"></textarea>
            <button type="submit">Send</button>
        </form>
        <aside id="history-panel" class="history-panel" aria-label="Conversation history"><header><strong>Conversation</strong></header>
            <div id="history-list" class="history-list"></div>
        </aside>
        <p id="status" class="status" aria-live="polite"></p>
    </main>
    <dialog id="help-dialog"><button id="close-help" type="button" aria-label="Close">×</button><h2>Need help?</h2><p>Write naturally, choose an idea, or ask for another example.</p></dialog>
    <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <title>Written Interaction</title>
    <script>
        // Edit these labels when the course, module, lesson, or level changes.
        window.PRACTICE_UI_TEXT = {
            title: "Written Interaction",
            module: "Module 12",
            topic: "Shopping",
            lesson: "Lesson 1",
            section: "Places",
            level: "English B1"
        };
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="stage" aria-label="Written language practice">
        <header class="topbar">
            <div class="course-context">
                <span id="course-title"></span><span class="separator">|</span>
                <span id="course-module"></span><span class="separator">|</span>
                <span id="course-topic"></span><span class="separator">|</span>
                <span id="course-lesson"></span><span class="separator">|</span>
                <span id="course-section"></span>
            </div>
            <div class="level-context">
                <span id="course-level"></span>
                <svg class="uk-flag" viewBox="0 0 60 36" role="img" aria-label="United Kingdom flag">
                    <rect width="60" height="36" fill="#17437b"/>
                    <path d="M0 0 60 36M60 0 0 36" stroke="#fff" stroke-width="9"/>
                    <path d="M0 0 60 36M60 0 0 36" stroke="#c8102e" stroke-width="4"/>
                    <path d="M30 0v36M0 18h60" stroke="#fff" stroke-width="14"/>
                    <path d="M30 0v36M0 18h60" stroke="#c8102e" stroke-width="7"/>
                </svg>
            </div>
        </header>

        <button id="close-practice" class="close-practice" type="button" aria-label="Close practice">×</button>

        <section id="history-panel" class="history-panel" aria-label="Conversation">
            <div id="history-list" class="history-list" aria-live="polite"></div>
        </section>

        <section class="natural-note">
            <span aria-hidden="true">▣</span>
            <p>Keep the conversation natural.<br>You can ask questions, request clarification, or share your opinion.</p>
        </section>

        <button id="help" class="corner-action help" type="button" aria-label="Help"><span>?</span>Help</button>

        <form id="composer" class="composer">
            <div class="composer-main">
                <textarea id="message" rows="2" placeholder="Write your answer…" aria-label="Your answer"></textarea>
                <button class="send-button" type="submit" aria-label="Send message">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 21 3l-7.2 18-3.1-7.3L3 11.2Zm7.7 2.5L21 3" /></svg>
                </button>
            </div>
            <div class="composer-tools" aria-label="Writing tools">
                <button type="button" class="tool-button" data-tool="hint"><span aria-hidden="true">☼</span> Get a hint</button>
                <button type="button" class="tool-button" data-tool="phrases"><span aria-hidden="true">▣</span> Useful phrases</button>
                <button type="button" class="tool-button" data-tool="grammar"><span aria-hidden="true">✧</span> Check my grammar</button>
            </div>
            <section id="tool-result" class="tool-result" aria-live="polite" hidden></section>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
    </main>

    <dialog id="help-dialog">
        <button id="close-help" type="button" aria-label="Close">×</button>
        <h2>Need help?</h2>
        <p>Write naturally, choose a writing tool, or ask the tutor for another example.</p>
    </dialog>
    <script src="app.js"></script>
</body>
</html>

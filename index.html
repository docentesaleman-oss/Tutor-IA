
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECH Language School</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ============================================================
     PANTALLA DE CARGA
     ============================================================ -->

<div id="loadingScreen">

    <div class="loadingContent">

        <div class="loadingIcon">
            🤖
        </div>

        <div class="loadingTitle">
            Estamos preparando tu tutor
        </div>

        <div class="loadingSubtitle">
            personalizado de IA
        </div>

        <div class="loadingSpinner"></div>

        <div class="loadingMessage">
            Por favor espera unos segundos...
        </div>

    </div>

</div>


<!-- ============================================================
     TUTOR
     ============================================================ -->

<div id="chat">

    <div id="header">

        <div class="title">
            TECH Language School
        </div>

        <div class="status">
            En línea
        </div>

    </div>

    <div id="messages"></div>

    <div id="inputArea">

        <textarea
            id="prompt"
            placeholder="Escribe aquí..."
            rows="1">
        </textarea>

        <button
            id="send"
            type="button"
            title="Enviar"
            aria-label="Enviar">
            ➤
        </button>

        <button
            id="clearChat"
            type="button"
            title="Eliminar chat"
            aria-label="Eliminar chat">
            🗑
        </button>

    </div>

</div>


<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>


<!-- ============================================================
     TIEMPO DE ESPERA DE LA PANTALLA DE CARGA
     
     CAMBIA SOLAMENTE EL 10000 SI QUIERES OTRO TIEMPO.
     
     10000 = 10 segundos
     15000 = 15 segundos
     20000 = 20 segundos
     ============================================================ -->

<script>

setTimeout(function(){

    document.getElementById("loadingScreen").classList.add("hidden");

    document.getElementById("chat").classList.add("show");

}, 10000);

</script>


</body>

</html>

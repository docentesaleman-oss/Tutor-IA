<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECH Language School</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>
<div id="loadingScreen">

    <div class="loadingContent">

        <div class="loadingSpinner"></div>

        <div class="loadingText">
            Hola, estamos cargando tu Tutor IA personalizado
        </div>

    </div>

</div>

<div id="chat">

    <div id="header">

        <div class="title">
            TECH Language School
        </div>

        <div class="status">
            En línea
        </div>

    </div>

    <div id="messages"></div>

    <div id="inputArea">

    <textarea
        id="prompt"
        placeholder="Escribe aquí..."
        rows="1">
    </textarea>

    <button id="send" type="button" title="Enviar" aria-label="Enviar">
        ➤
    </button>

    <button id="clearChat" type="button" title="Eliminar chat" aria-label="Eliminar chat">
        🗑
    </button>

</div>



<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

<script>

async function controlarPantallaCarga() {

    const loadingScreen =
        document.getElementById("loadingScreen");

    try {

        const respuesta =
            await fetch("/server-status");

        const datos =
            await respuesta.json();

        const instanciaActual =
            datos.instanceId;

        const instanciaGuardada =
            localStorage.getItem(
                "tutorIA_instanciaServidor"
            );


        /*
        ====================================================
        MISMA INSTANCIA
        NO MOSTRAR CARGA
        ====================================================
        */

        if (
            instanciaGuardada ===
            instanciaActual
        ) {

            loadingScreen.style.display =
                "none";

            return;

        }


        /*
        ====================================================
        NUEVA INSTANCIA
        MOSTRAR CARGA
        ====================================================
        */

        localStorage.setItem(
    "tutorIA_instanciaServidor",
    instanciaActual
);


loadingScreen.style.display =
    "flex";


setTimeout(() => {

    loadingScreen.style.display =
        "none";

}, 10000);


    } catch (error) {

    loadingScreen.style.display =
        "flex";


    setTimeout(() => {

        loadingScreen.style.display =
            "none";

    }, 10000);

}


window.addEventListener(
    "load",
    controlarPantallaCarga
);

</script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet" href="css/style.css">

</head>

<body>
<div id="loadingScreen">

    <div class="loadingContent">

        <div class="loadingSpinner"></div>

        <div class="loadingText">
            Hola, estamos cargando tu Tutor IA personalizado
        </div>

    </div>

</div>

<div id="chat">

    <div id="header">

       
    </div>

    <div id="messages"></div>

   <div id="inputArea">

    <textarea
        id="prompt"
        placeholder="Escribe aquí..."
        rows="1">
    </textarea>

    <button
        id="microphone"
        type="button"
        title="Hablar"
        aria-label="Hablar">
        🎤
    </button>

    <button id="send" type="button" title="Enviar" aria-label="Enviar">
        ➤
    </button>

    <button id="clearChat" type="button" title="Eliminar chat" aria-label="Eliminar chat">
        🗑
    </button>

</div>




<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

<script>

function controlarPantallaCarga() {

    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const cargaMostrada =
        localStorage.getItem(
            "tutorIA_pantallaCargaMostrada"
        );


    /*
    ====================================================
    SI YA SE MOSTRÓ
    ====================================================
    */

    if (
        cargaMostrada === "true"
    ) {

        loadingScreen.style.display =
            "none";

        return;

    }


    /*
    ====================================================
    PRIMERA VEZ
    MOSTRAR PANTALLA
    ====================================================
    */

    loadingScreen.style.display =
        "flex";


    setTimeout(() => {

        loadingScreen.style.display =
            "none";


        localStorage.setItem(
            "tutorIA_pantallaCargaMostrada",
            "true"
        );


    }, 10000);

}


window.addEventListener(
    "load",
    controlarPantallaCarga
);

</script>

       </body>

</html>

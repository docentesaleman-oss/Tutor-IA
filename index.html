<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECH Language School</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="chat">

    <div id="header">

        <div class="title">
            TECH Language School
        </div>

        <div class="status">
            En línea
        </div>

    </div>

    <div id="messages"></div>

    <div id="inputArea">

        <textarea
            id="prompt"
            placeholder="Escribe aquí..."
            rows="1">
        </textarea>

        <button id="send">
            Enviar
        </button>

        <button id="clearChat" type="button">
            Eliminar chat
        </button>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>

</html>

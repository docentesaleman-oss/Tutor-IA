<!doctype html>
<html lang="en" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <title>Oral Interaction</title>
    <script>
        // Edit these labels when the course, module, lesson, or level changes.
        window.PRACTICE_UI_TEXT = {
            title: "Oral Interaction",
            module: "Module 12",
            topic: "Shopping",
            lesson: "Lesson 1",
            section: "Places",
            level: "English B1"
        };
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="stage" aria-label="Oral English practice">
        <header class="topbar">
            <div class="course-context">
                <strong id="course-title"></strong><span class="separator">|</span>
                <span id="course-module"></span><span class="separator">|</span>
                <span id="course-topic"></span><span class="separator">|</span>
                <span id="course-lesson"></span><span class="separator">|</span>
                <span id="course-section"></span>
            </div>
            <div class="level-context">
                <span id="course-level"></span>
                <svg class="uk-flag" viewBox="0 0 60 36" role="img" aria-label="United Kingdom flag">
                    <rect width="60" height="36" fill="#17437b"/>
                    <path d="M0 0 60 36M60 0 0 36" stroke="#fff" stroke-width="9"/>
                    <path d="M0 0 60 36M60 0 0 36" stroke="#c8102e" stroke-width="4"/>
                    <path d="M30 0v36M0 18h60" stroke="#fff" stroke-width="14"/>
                    <path d="M30 0v36M0 18h60" stroke="#c8102e" stroke-width="7"/>
                </svg>
            </div>
        </header>

        <button id="close-practice" class="close-practice" type="button" aria-label="Close practice">×</button>
        <section class="tutor-row" aria-live="polite">
            <img class="tutor-avatar" src="Perfil.png" alt="AI Tutor">
            <div class="tutor-content">
                <span class="tutor-badge">AI Tutor</span>
                <section class="tutor-message">
                    <button class="listen-button" id="listen" type="button" aria-label="Listen to tutor">🔊</button>
                    <div>
                        <p id="tutor-text">Loading your practice…</p>
                        <p class="question">Speak naturally to continue.</p>
                    </div>
                </section>
            </div>
        </section>

        <section class="suggestion-card" aria-label="Suggested phrases">
            <p class="hint">Try to…</p>
            <div id="suggestions" class="suggestions"></div>
        </section>

        <section class="natural-note">
            <span aria-hidden="true">?</span>
            <p><strong>Need help?</strong><br>Get a hint or useful phrases</p>
            <span class="note-chevron" aria-hidden="true">›</span>
        </section>

        <section class="voice-area">
            <img class="microphone-art" src="microfono.png" alt="">
            <button id="microphone" class="microphone" type="button" aria-label="Press to speak">
            </button>
            <p id="voice-label">Press to speak</p>
        </section>

        <button id="history-toggle" class="corner-action history" type="button"><span>☰</span>History</button>
        <button id="help" class="corner-action help" type="button"><span>?</span>Help</button>

        <aside id="history-panel" class="history-panel" hidden aria-label="Conversation history">
            <header><strong>Conversation</strong><button id="close-history" type="button" aria-label="Close history">×</button></header>
            <div id="history-list" class="history-list"></div>
        </aside>
        <p id="status" class="status" aria-live="polite"></p>
    </main>
    <dialog id="help-dialog">
        <button id="close-help" type="button" aria-label="Close">×</button>
        <h2>Need help?</h2>
        <p>Speak naturally, choose an idea, or ask for another example.</p>
    </dialog>
    <script>
        const uiText = window.PRACTICE_UI_TEXT;
        document.getElementById("course-title").textContent = uiText.title;
        document.getElementById("course-module").textContent = uiText.module;
        document.getElementById("course-topic").textContent = uiText.topic;
        document.getElementById("course-lesson").textContent = uiText.lesson;
        document.getElementById("course-section").textContent = uiText.section;
        document.getElementById("course-level").textContent = uiText.level;
    </script>
    <script src="app.js"></script>
</body>
</html>

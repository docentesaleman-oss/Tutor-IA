<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guided practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="practice-shell">
    <section class="tutor-visual" aria-label="Your practice tutor">
      <div class="brand">Talk · Explore · Learn</div>
      <div class="avatar" aria-hidden="true"><span>AI</span></div>
      <div class="tutor-name">Your conversation tutor</div>
    </section>
    <section class="conversation-panel">
      <header><p class="eyebrow">Guided conversation</p><h1 id="title">Loading practice…</h1></header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <section id="suggestions" class="suggestions" aria-label="Suggested answers"></section>
      <form id="composer" class="composer">
        <textarea id="message" rows="2" placeholder="Write your answer…" aria-label="Your answer"></textarea>
        <div class="actions"><button id="microphone" type="button" class="voice">🎙 Speak</button><button type="submit" class="send">Send</button></div>
        <p id="status" class="status" aria-live="polite"></p>
      </form>
      <footer><span>Ask for an example, an explanation, or pronunciation help.</span><button id="help" type="button">Help</button></footer>
    </section>
  </main>
  <dialog id="help-dialog"><button id="close-help" class="close" type="button" aria-label="Close">×</button><h2>What can I say?</h2><p>Try speaking naturally, choose a suggestion, or ask for another example.</p></dialog>
  <script src="app.js"></script>
</body>
</html>
